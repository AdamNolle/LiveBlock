name: Desktop CI

on:
  pull_request:
    branches: [main, feat/openvocab-detector]
  push:
    branches: [main, feat/openvocab-detector]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-contracts:
    name: Shared Rust, Python, and frontend contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: platform/_shared-frontend/package-lock.json
      - name: Install model-signing test dependency
        run: python -m pip install 'cryptography>=45.0'
      - name: Rust formatting
        run: cargo fmt --manifest-path core/Cargo.toml --all -- --check
      - name: Shared Rust tests
        run: cargo test --manifest-path core/Cargo.toml --workspace --lib
      - name: Label and desktop adapter contract tests
        env:
          PYTHONPATH: tools
        run: python -m unittest tools.test_export_labels tools.test_desktop_contracts tools.test_model_distribution tools.test_release_docs tools.test_desktop_validation_evidence tools.test_release_evidence
      - name: Explicit migration, installer, and update recovery gates
        env:
          PYTHONPATH: tools
        run: |
          cargo test --manifest-path core/Cargo.toml --workspace --lib migrat
          cargo test --manifest-path core/Cargo.toml -p liveblock-config --lib model_manifest::tests::atomic_install
          cargo test --manifest-path core/Cargo.toml -p liveblock-config --lib model_update::tests::
          python -m unittest \
            tools.test_model_distribution.ModelDistributionTests.test_install_cli_strips_canonical_signing_secret \
            tools.test_model_distribution.ModelDistributionTests.test_signed_coreml_bundle_verifier_binds_compiled_artifact
      - name: Release profile stays inference-only
        run: cargo test --manifest-path core/Cargo.toml -p liveblock-config --lib --release build_profile_controls_training_runtime
      - name: Parse published JSON Schemas
        run: |
          python -m json.tool contracts/regions.schema.json >/dev/null
          python -m json.tool contracts/labels.schema.json >/dev/null
          python -m json.tool contracts/settings.schema.json >/dev/null
          python -m json.tool contracts/model-manifest.schema.json >/dev/null
          python -m json.tool contracts/model-keyring.schema.json >/dev/null
          python -m json.tool contracts/model-update-state.schema.json >/dev/null
          python -m json.tool contracts/release-artifact-inventory.schema.json >/dev/null
      - name: Shared frontend build
        working-directory: platform/_shared-frontend
        run: npm ci && npm run build
      - name: Generate dependency SBOM, license report, and webview inventory
        run: |
          mkdir -p tools/runs/ci-release-evidence
          cargo metadata --manifest-path core/Cargo.toml --locked --format-version 1 > tools/runs/ci-release-evidence/core-metadata.json
          cargo metadata --manifest-path platform/windows/src-tauri/Cargo.toml --locked --format-version 1 > tools/runs/ci-release-evidence/windows-metadata.json
          cargo metadata --manifest-path platform/linux/src-tauri/Cargo.toml --locked --format-version 1 > tools/runs/ci-release-evidence/linux-metadata.json
          python tools/release_evidence.py sbom \
            --cargo-metadata tools/runs/ci-release-evidence/core-metadata.json \
            --cargo-metadata tools/runs/ci-release-evidence/windows-metadata.json \
            --cargo-metadata tools/runs/ci-release-evidence/linux-metadata.json \
            --npm-lock platform/_shared-frontend/package-lock.json \
            --output tools/runs/ci-release-evidence/liveblock.cdx.json \
            --license-report tools/runs/ci-release-evidence/dependency-licenses.json \
            --commit "$GITHUB_SHA"
          python tools/release_evidence.py inventory \
            --root platform/_shared-frontend/dist \
            --output tools/runs/ci-release-evidence/webview-inventory.json \
            --platform shared \
            --artifact-type webview-payload-build-only \
            --commit "$GITHUB_SHA" \
            --require control-panel.html --require labeling.html \
            --require region-editor.html --require render-layer.html --require training.html
          python tools/release_evidence.py verify \
            --root platform/_shared-frontend/dist \
            --manifest tools/runs/ci-release-evidence/webview-inventory.json
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            -cf tools/runs/ci-release-evidence/webview-payload.tar \
            -C platform/_shared-frontend/dist .
          sha256sum tools/runs/ci-release-evidence/webview-payload.tar \
            > tools/runs/ci-release-evidence/webview-payload.tar.sha256
      - name: Preserve release dependency and integrity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-dependency-integrity-evidence
          path: |
            tools/runs/ci-release-evidence/liveblock.cdx.json
            tools/runs/ci-release-evidence/dependency-licenses.json
            tools/runs/ci-release-evidence/webview-inventory.json
            tools/runs/ci-release-evidence/webview-payload.tar
            tools/runs/ci-release-evidence/webview-payload.tar.sha256
          if-no-files-found: error

  macos:
    name: macOS 26 build and tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate bridge inputs
        run: LB_BRIDGE_HOST_ONLY=1 tools/build_bridge.sh
      - name: Empty macOS production model inputs fail closed
        run: |
          mkdir -p tools/runs
          xcodegen generate
          if xcodebuild -quiet -project LiveBlock.xcodeproj -scheme LiveBlock \
            -configuration Release -destination 'platform=macOS' \
            -derivedDataPath tools/runs/ci-macos-keyring-gate \
            build CODE_SIGNING_ALLOWED=NO >tools/runs/ci-macos-keyring-gate.log 2>&1; then
            echo "empty macOS production model inputs were accepted" >&2
            exit 1
          fi
          grep -q "model keyring must be a regular file\|production model keyring must contain at least one key" \
            tools/runs/ci-macos-keyring-gate.log
      - name: Generate, test Debug, and compile Release
        env:
          LIVEBLOCK_ALLOW_EMPTY_MODEL_KEYRING: "1"
        run: |
          xcodegen generate
          xcodebuild -project LiveBlock.xcodeproj -scheme LiveBlock \
            -destination 'platform=macOS' \
            -derivedDataPath tools/runs/ci-macos-derived \
            test CODE_SIGNING_ALLOWED=NO
          xcodebuild -project LiveBlock.xcodeproj -scheme LiveBlock \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath tools/runs/ci-macos-derived \
            build CODE_SIGNING_ALLOWED=NO
      - name: Preserve macOS test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-xcresult
          path: |
            tools/runs/ci-macos-derived/Logs/Test/*.xcresult
            tools/runs/ci-macos-keyring-gate.log
          if-no-files-found: warn

  windows:
    name: Windows 11 compile
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: platform/windows
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: platform/_shared-frontend/package-lock.json
      - name: Build shared frontend
        working-directory: platform/_shared-frontend
        run: npm ci && npm run build
      - name: Compile Windows adapter (debug and release, all targets)
        run: |
          cargo check --manifest-path platform/windows/src-tauri/Cargo.toml --locked --all-targets
          cargo test --manifest-path platform/windows/src-tauri/Cargo.toml --locked --lib
          $output = cargo check --manifest-path platform/windows/src-tauri/Cargo.toml --locked --all-targets --release 2>&1 | Out-String
          if ($LASTEXITCODE -eq 0 -or $output -notmatch "release packages require a nonempty") {
            throw "empty production model keyring was not rejected as expected`n$output"
          }
          $env:LIVEBLOCK_ALLOW_EMPTY_MODEL_KEYRING = "1"
          cargo check --manifest-path platform/windows/src-tauri/Cargo.toml --locked --all-targets --release

  linux:
    name: Ubuntu Linux compile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: platform/linux
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: platform/_shared-frontend/package-lock.json
      - name: Install Tauri, PipeWire, Wayland, and X11 headers
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libpipewire-0.3-dev libspa-0.2-dev \
            libx11-xcb-dev libxcomposite-dev libxfixes-dev libxinerama-dev \
            libxkbcommon-dev libwayland-dev libgtk-layer-shell-dev
      - name: Build shared frontend
        working-directory: platform/_shared-frontend
        run: npm ci && npm run build
      - name: Compile Linux adapter (debug and release, all targets)
        run: |
          cargo check --manifest-path platform/linux/src-tauri/Cargo.toml --locked --all-targets
          cargo test --manifest-path platform/linux/src-tauri/Cargo.toml --locked --lib
          if cargo check --manifest-path platform/linux/src-tauri/Cargo.toml --locked --all-targets --release 2>empty-ring.log; then
            echo "empty production model keyring was accepted" >&2
            exit 1
          fi
          grep -q "release packages require a nonempty" empty-ring.log
          LIVEBLOCK_ALLOW_EMPTY_MODEL_KEYRING=1 cargo check --manifest-path platform/linux/src-tauri/Cargo.toml --locked --all-targets --release
