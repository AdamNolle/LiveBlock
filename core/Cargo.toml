[workspace]
resolver = "2"
members = [
    "crates/liveblock-core",
    "crates/liveblock-regions",
    "crates/liveblock-labels",
    "crates/liveblock-detection",
    "crates/liveblock-bridge",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["LiveBlock contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"
async-trait = "0.1"
