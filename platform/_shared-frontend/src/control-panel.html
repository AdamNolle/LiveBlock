<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <title>LiveBlocker — Control Panel</title>
    <link rel="stylesheet" href="./tokens.css"/>
    <link rel="stylesheet" href="./primitives.css"/>
    <style>
      .panel { padding: 18px; display:flex; flex-direction:column; gap:14px; }
      .head { display:flex; align-items:center; gap:10px; }
      .head .col { flex:1; min-width:0; }
      .head .name { font: 600 13px var(--lb-font-ui); color: var(--lb-ink); }
      .head .meta { display:flex; align-items:center; gap:5px; font: 500 11px var(--lb-font-ui); color: var(--lb-ink-muted); margin-top: 1px; }
      .actions { display:flex; gap:8px; }
      .actions .lb-pill { flex:1; justify-content:center; }
      .stats { display:grid; grid-template-columns: 1fr 1fr 1fr; gap:8px; }
      .stat {
        padding: 10px 8px;
        border-radius: 14px;
        text-align:center;
        background: var(--lb-bg);
        box-shadow:
          inset 4.4px 4.4px 12.6px var(--lb-shadow-dark),
          inset -4.4px -4.4px 12.6px var(--lb-shadow-light);
      }
      .stat .v { font: 600 18px var(--lb-font-mono); line-height:1; }
      .stat .l { font: 600 9px var(--lb-font-ui); margin-top:4px; letter-spacing:0.04em; text-transform:uppercase; color: var(--lb-ink-muted); }
      .stat.block .v { color: var(--lb-block); }
      .stat.train .v { color: var(--lb-train); }
      .stat.detect .v { color: var(--lb-detect); }
      .row {
        display:flex; align-items:center; gap:10px;
        padding: 8px 10px; border-radius: 10px;
      }
      .row.active { background: rgba(255,255,255,0.5); }
      .footer { display:flex; align-items:center; gap:8px; }
      .notice { padding:9px 10px;border-radius:10px;background:rgba(224,148,42,.12);color:var(--lb-ink);font:500 11px/1.35 var(--lb-font-ui); }
      .swatch { width:16px; height:16px; border-radius:4px; }
    </style>
  </head>
  <body>
    <div class="panel">
      <div class="head">
        <span id="logo"></span>
        <div class="col">
          <div class="name">LiveBlocker</div>
          <div class="meta"><span id="statusDot" class="lb-dot"></span><span id="status">Stopped · 0 regions</span></div>
        </div>
        <span id="powerToggle"></span>
      </div>

      <div id="capabilityNotice" class="notice" role="status" hidden></div>

      <div class="actions">
        <button class="lb-pill lb-block" id="blockBtn">⌧ Block</button>
        <button class="lb-pill lb-train" id="trainBtn">⊕ Train</button>
      </div>

      <div class="stats">
        <div class="stat block"><div class="v" id="statBlocked">0</div><div class="l">blocked today</div></div>
        <div class="stat train"><div class="v" id="statRegions">0</div><div class="l">active regions</div></div>
        <div class="stat detect"><div class="v" id="statDropped">0</div><div class="l">stale dropped</div></div>
      </div>

      <div class="lb-uppercase">This space</div>
      <div style="border-radius:14px;padding:4px;background:var(--lb-bg);box-shadow:inset 4.4px 4.4px 12.6px var(--lb-shadow-dark),inset -4.4px -4.4px 12.6px var(--lb-shadow-light)">
        <div class="row active">
          <div class="swatch" style="background:#3da6ff"></div>
          <div style="flex:1;font-size:12px;font-weight:500">Foreground app</div>
          <span class="lb-mono" style="font-size:11px;color:var(--lb-ink-muted)">—</span>
          <span id="appToggle"></span>
        </div>
      </div>

      <div class="footer">
        <button class="lb-pill lb-sm" id="prefsBtn">⚙ Preferences</button>
        <div class="lb-spacer"></div>
        <span class="lb-mono" style="font-size:10px;color:var(--lb-ink-faint)">Ctrl+Shift+B</span>
      </div>
    </div>

    <script type="module">
      import { logo, toggle } from "./primitives.ts";
      import { events, lb } from "./ipc.ts";

      document.getElementById("logo").appendChild(logo({ size: 32, radius: 8 }));
      let selectedMonitorId = null;
      let running = false;
      let protectedContent = false;
      let captureError = null;
      let regionCount = 0;
      let capabilitiesLoaded = false;
      const power = toggle({
        value: false,
        accent: "success",
        onChange: async (on) => {
          try {
            if (on) {
              if (!selectedMonitorId) throw new Error("No capture monitor is available");
              captureError = null;
              await lb.startCapture(selectedMonitorId);
            } else {
              await lb.stopCapture();
            }
          } catch (error) {
            power.dataset.on = String(running);
            captureError = String(error);
            renderStatus();
          }
        },
      });
      document.getElementById("powerToggle").appendChild(power);
      document.getElementById("appToggle").appendChild(toggle({ value: true, accent: "block" }));

      document.getElementById("blockBtn").addEventListener("click", () => lb.showWindow("editor"));
      document.getElementById("trainBtn").addEventListener("click", () => lb.showWindow("training"));
      document.getElementById("prefsBtn").addEventListener("click", () => lb.showWindow("settings"));

      function renderStatus() {
        const dot = document.getElementById("statusDot");
        dot.className = "lb-dot";
        let text;
        if (captureError) {
          dot.classList.add("warn");
          text = "Capture error · restart required";
        } else if (protectedContent) {
          dot.classList.add("warn");
          text = "Possible protected or unavailable content · overlays paused";
        } else if (running) {
          dot.classList.add("success", "pulse");
          text = `Active · ${regionCount} region${regionCount === 1 ? "" : "s"}`;
        } else {
          text = `Stopped · ${regionCount} region${regionCount === 1 ? "" : "s"}`;
        }
        document.getElementById("status").textContent = text;
      }

      events.onCaptureState((value) => {
        running = value;
        power.dataset.on = String(value);
        if (value) captureError = null;
        renderStatus();
      });
      events.onProtectedContent((value) => {
        protectedContent = value;
        renderStatus();
      });
      events.onCaptureError((message) => {
        captureError = message;
        running = false;
        power.dataset.on = "false";
        renderStatus();
      });

      // Refresh counters periodically. Values come from native telemetry; no
      // synthetic frame-time claim is shown.
      async function refresh() {
        try {
          if (!capabilitiesLoaded) {
            const capabilities = await lb.getCapabilities();
            capabilitiesLoaded = true;
            if (capabilities.supportMode === "limited" || !capabilities.releaseReady) {
              const notice = document.getElementById("capabilityNotice");
              const platform = capabilities.platform.replaceAll("_", " ");
              notice.textContent = `${platform}: ${capabilities.limitations.join(" ")}`;
              notice.hidden = false;
            }
          }
          if (!selectedMonitorId) {
            const monitors = await lb.listMonitors();
            selectedMonitorId = monitors.find((monitor) => monitor.isPrimary)?.id ?? monitors[0]?.id ?? null;
          }
          const [regions, telemetry] = await Promise.all([lb.listRegions(), lb.getCaptureTelemetry()]);
          regionCount = regions.length;
          protectedContent = telemetry.protectedContent;
          document.getElementById("statRegions").textContent = String(regionCount);
          document.getElementById("statDropped").textContent = String(telemetry.droppedFrames);
          renderStatus();
        } catch (_) { /* tauri not present in `vite preview` mode */ }
      }
      refresh();
      setInterval(refresh, 1000);
    </script>
  </body>
</html>
