<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <title>LiveBlock — Region Editor</title>
    <link rel="stylesheet" href="./tokens.css"/>
    <link rel="stylesheet" href="./primitives.css"/>
    <style>
      body { background: rgba(20,14,30,0.22); user-select:none; }
      .stage { position:absolute; inset:0; cursor:crosshair; touch-action:none; }
      .region, .preview {
        position:absolute; box-sizing:border-box; border:2px solid var(--lb-block);
        background:rgba(255,74,46,.14); border-radius:8px;
        box-shadow:0 0 0 1px rgba(255,255,255,.65) inset;
      }
      .region button {
        position:absolute; top:-11px; right:-11px; width:22px; height:22px;
        border:0; border-radius:50%; background:var(--lb-block); color:white;
        font:700 13px var(--lb-font-ui); cursor:pointer;
      }
      .preview { border-style:dashed; pointer-events:none; }
      .toolbar {
        display:flex; align-items:center; gap:8px; padding:10px; border-radius:28px;
        background:var(--lb-bg); box-shadow:8px 8px 18px rgba(0,0,0,.35),-3px -3px 8px var(--lb-shadow-light);
      }
      .seg { display:flex; gap:2px; padding:3px; border-radius:999px; background:var(--lb-bg); box-shadow:inset 4.4px 4.4px 12.6px var(--lb-shadow-dark),inset -4.4px -4.4px 12.6px var(--lb-shadow-light); }
      .seg .opt { min-width:28px; height:28px; padding:0 7px; border-radius:999px; display:flex; align-items:center; justify-content:center; font:700 11px var(--lb-font-ui); color:var(--lb-ink-2); cursor:pointer; border:0; }
      .div { width:1px; height:28px; background:rgba(0,0,0,.07); }
      .cancel { width:32px; height:32px; border-radius:50%; background:var(--lb-bg); border:0; color:var(--lb-ink-muted); font:600 16px var(--lb-font-ui); box-shadow:3px 3px 6px var(--lb-shadow-dark),-3px -3px 6px var(--lb-shadow-light); }
      .hint { margin-top:10px; text-align:center; color:rgba(255,255,255,.8); text-shadow:0 1px 2px rgba(0,0,0,.5); font:500 11px var(--lb-font-ui); letter-spacing:.04em; }
      .error { color:#fff; background:rgba(145,20,20,.9); padding:5px 9px; border-radius:8px; margin-top:7px; font:600 11px var(--lb-font-ui); }
    </style>
  </head>
  <body>
    <div class="stage" id="stage" aria-label="Drag to create a protected region"></div>
    <div style="position:absolute;left:50%;transform:translateX(-50%);bottom:24px;display:flex;flex-direction:column;align-items:center;z-index:10">
      <div class="toolbar">
        <span id="logo"></span><div class="div"></div>
        <div class="seg" id="presetSeg" aria-label="Quick region presets">
          <button class="opt" data-size="sm" title="Add a small centered region">S</button>
          <button class="opt" data-size="md" title="Add a medium centered region">M</button>
          <button class="opt" data-size="lg" title="Add a large centered region">L</button>
          <button class="opt" data-size="fs" title="Protect the full display">Full</button>
        </div>
        <div class="div"></div>
        <button class="lb-pill lb-block" id="clearBtn">Clear all</button>
        <div class="div"></div><button class="cancel" id="cancelBtn" aria-label="Close">×</button>
      </div>
      <div class="hint" id="editorHint">DRAG ANYWHERE TO MARK · CLICK × ON A REGION TO DELETE</div>
      <div class="error" id="error" role="alert" hidden></div>
    </div>

    <script type="module">
      import { logo } from "./primitives.ts";
      import { events, lb } from "./ipc.ts";

      document.getElementById("logo").appendChild(logo({ size:32, radius:8 }));
      const stage = document.getElementById("stage");
      const errorBox = document.getElementById("error");
      let regions = [];
      let drag = null;

      const fail = (error) => {
        errorBox.textContent = String(error);
        errorBox.hidden = false;
      };
      const clearError = () => { errorBox.hidden = true; };
      const regionStyle = (element, region) => {
        element.style.left = `${region.x * 100}%`;
        element.style.top = `${region.y * 100}%`;
        element.style.width = `${region.width * 100}%`;
        element.style.height = `${region.height * 100}%`;
      };
      const render = () => {
        stage.querySelectorAll(".region").forEach((node) => node.remove());
        for (const region of regions) {
          const node = document.createElement("div");
          node.className = "region";
          regionStyle(node, region);
          const remove = document.createElement("button");
          remove.textContent = "×";
          remove.ariaLabel = "Delete region";
          remove.addEventListener("pointerdown", (event) => event.stopPropagation());
          remove.addEventListener("click", async (event) => {
            event.stopPropagation();
            try { clearError(); await lb.deleteRegion(region.id); }
            catch (error) { fail(error); }
          });
          node.appendChild(remove);
          stage.appendChild(node);
        }
      };
      const point = (event) => {
        const rect = stage.getBoundingClientRect();
        return {
          x: Math.min(1, Math.max(0, (event.clientX - rect.left) / rect.width)),
          y: Math.min(1, Math.max(0, (event.clientY - rect.top) / rect.height)),
        };
      };
      const normalizedRect = (a, b) => ({
        id: crypto.randomUUID(),
        x: Math.min(a.x, b.x), y: Math.min(a.y, b.y),
        width: Math.abs(b.x - a.x), height: Math.abs(b.y - a.y),
      });

      stage.addEventListener("pointerdown", (event) => {
        if (event.button !== 0 || event.target !== stage) return;
        clearError();
        stage.setPointerCapture(event.pointerId);
        const start = point(event);
        const preview = document.createElement("div");
        preview.className = "preview";
        stage.appendChild(preview);
        drag = { pointerId:event.pointerId, start, preview };
      });
      stage.addEventListener("pointermove", (event) => {
        if (!drag || drag.pointerId !== event.pointerId) return;
        regionStyle(drag.preview, normalizedRect(drag.start, point(event)));
      });
      async function finishDrag(event) {
        if (!drag || drag.pointerId !== event.pointerId) return;
        const active = drag;
        drag = null;
        active.preview.remove();
        const region = normalizedRect(active.start, point(event));
        if (region.width < .005 || region.height < .005) return;
        try { await lb.addRegion(region); }
        catch (error) { fail(error); }
      }
      stage.addEventListener("pointerup", finishDrag);
      stage.addEventListener("pointercancel", (event) => {
        if (drag?.pointerId === event.pointerId) { drag.preview.remove(); drag = null; }
      });

      document.querySelectorAll("#presetSeg .opt").forEach((button) => {
        button.addEventListener("click", async () => {
          const dimensions = { sm:[.20,.12], md:[.36,.22], lg:[.58,.36], fs:[1,1] }[button.dataset.size];
          const [width, height] = dimensions;
          try {
            clearError();
            await lb.addRegion({ id:crypto.randomUUID(), x:(1-width)/2, y:(1-height)/2, width, height });
          } catch (error) { fail(error); }
        });
      });
      document.getElementById("clearBtn").addEventListener("click", async () => {
        try { clearError(); await lb.clearRegions(); } catch (error) { fail(error); }
      });
      document.getElementById("cancelBtn").addEventListener("click", () => lb.hideWindow("editor").catch(fail));

      const setHint = (available, binding="Control+Shift+B") => {
        document.getElementById("editorHint").textContent = available
          ? `DRAG TO MARK · CLICK × TO DELETE · ${binding} HIDES THIS TOOL`
          : "DRAG TO MARK · CLICK × TO DELETE · Use × to close (global hotkeys unavailable)";
      };
      Promise.all([lb.getCapabilities(), lb.getBehaviorContract()]).then(([capabilities, contract]) => {
        const binding = contract.hotkeys.find((item) => item.action === "toggle_region_editor");
        setHint(capabilities.globalHotkeys, binding?.windowsLinux);
      }).catch(() => {});
      events.onHotkeyAvailability((available) => setHint(available));
      events.onRegions((next) => { regions = next; render(); });
      lb.listRegions().then((next) => { regions = next; render(); }).catch(fail);
    </script>
  </body>
</html>
