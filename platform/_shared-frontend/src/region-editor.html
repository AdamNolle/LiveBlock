<!doctype html>
<html lang="en" class="lb-region-editor">
  <head>
    <meta charset="utf-8"/>
    <title>LiveBlock — Region Editor</title>
    <link rel="stylesheet" href="./tokens.css"/>
    <link rel="stylesheet" href="./primitives.css"/>
    <style>
    html.lb-region-editor { background: transparent; }
    html.lb-region-editor body { background: rgba(20,20,30,0.15); }
      .stage { position:absolute; inset:0; }
      .toolbar {
        position:relative;
        display:flex; align-items:center; gap:8px;
        padding: 10px;
        border-radius: 16px;
        background: var(--lb-bg);
        border:1px solid var(--lb-border);
        box-shadow:0 4px 16px rgba(0,0,0,0.18);
      }
      .editor-controls { position:absolute; left:50%; transform:translateX(-50%); bottom:24px; display:flex; flex-direction:column; align-items:center; max-width:calc(100% - 32px); }
    #markBtn { white-space:nowrap; }
    [hidden] { display: none !important; }
      .seg {
        display:flex; gap:2px; padding:3px; border-radius:999px;
        background: var(--lb-bg);
        box-shadow:
          inset 4.4px 4.4px 12.6px var(--lb-shadow-dark),
          inset -4.4px -4.4px 12.6px var(--lb-shadow-light);
      }
      .seg .opt {
        width:28px; height:28px; border-radius:999px;
        display:flex; align-items:center; justify-content:center;
        font: 700 12px var(--lb-font-ui); color: var(--lb-ink-2);
        cursor:pointer; border: 0;
      }
      .seg .opt.active { background: var(--lb-block); color: #fff; box-shadow: 0 2px 6px rgba(255,74,46,0.4); }
      .div { width:1px; height:28px; background: rgba(0,0,0,0.07); }
      .cancel {
        width:32px; height:32px; border-radius:50%;
        background: var(--lb-bg); border:0; color: var(--lb-ink-muted);
        font: 600 16px var(--lb-font-ui);
        box-shadow:
          3px 3px 6px var(--lb-shadow-dark),
          -3px -3px 6px var(--lb-shadow-light);
      }
      .hint { margin-top:10px; text-align:center; color: rgba(255,255,255,0.65); font: 500 11px var(--lb-font-ui); letter-spacing: 0.04em; }
      .region-box { position:absolute; border:2px solid var(--lb-block); background:color-mix(in srgb, var(--lb-block) 15%, transparent); box-sizing:border-box; pointer-events:none; }
    </style>
  </head>
  <body>
    <div class="stage"></div>
    <div class="editor-controls">
      <div class="toolbar">
        <span id="logo"></span>
        <div class="div"></div>
        <div class="seg" id="sizeSeg" hidden>
          <button class="opt" data-id="sm">S</button>
          <button class="opt active" data-id="md">M</button>
          <button class="opt" data-id="lg">L</button>
          <button class="opt" data-id="fs">⤢</button>
        </div>
        <div class="div"></div>
        <span class="lb-pill" id="markBtn">Drag to mark · Delete removes the last region</span>
        <div class="div"></div>
        <button class="cancel" id="cancelBtn" aria-label="Close region editor">×</button>
      </div>
      <div class="hint">DRAG TO MARK · ESC TO CLOSE · DELETE TO REMOVE</div>
    </div>

    <script type="module" src="./editor.ts"></script>
  </body>
</html>
