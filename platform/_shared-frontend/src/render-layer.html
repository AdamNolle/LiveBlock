<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <title>LiveBlocker — Render Layer</title>
    <style>
      html, body { margin:0; height:100%; background: transparent; pointer-events: none; overflow: hidden; }
      #patches { position:absolute; inset:0; pointer-events: none; }
      .patch { position:absolute; border-radius: 0; }
    </style>
  </head>
  <body>
    <div id="patches"></div>
    <script type="module">
      import { events, lb } from "./ipc.ts";
      import { renderPatches } from "./render.ts";
      const root = document.getElementById("patches");
      events.onPatches(patches => renderPatches(root, patches)).then(async () => {
        // Recover a cover emitted before this hidden webview finished loading.
        renderPatches(root, await lb.currentPatches());
      }).catch(console.error);
    </script>
  </body>
</html>
