[package]
name = "liveblock-linux"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LiveBlock — Linux port (Rust + Tauri 2 + Wayland/X11)"

[lib]
name = "liveblock_linux_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "liveblock-linux"
path = "src/main.rs"

[features]
default = ["cpu"]
# Pick exactly one of these EPs at build time. CPU is the safe default.
cpu = []
cuda = ["ort/cuda"]
rocm = ["ort/rocm"]
openvino = ["ort/openvino"]
tensorrt = ["ort/tensorrt"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }
liveblock-config = { path = "../../../core/crates/liveblock-config" }

[dependencies]
# Shared core (data types + JSON format identical to macOS / Windows).
liveblock-regions = { path = "../../../core/crates/liveblock-regions" }
liveblock-labels = { path = "../../../core/crates/liveblock-labels" }
liveblock-detection = { path = "../../../core/crates/liveblock-detection" }
liveblock-config = { path = "../../../core/crates/liveblock-config" }

tauri = { version = "2.0", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-shell = "2.0"
tauri-plugin-os = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
once_cell = "1.19"
anyhow = "1"
async-trait = "0.1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
ndarray = "=0.15.6"
arc-swap = "1.7"
crossbeam-channel = "0.5"
dirs = "5"

# ONNX Runtime — Linux gets multiple EPs as cargo features.
ort = { version = "=2.0.0-rc.4", default-features = false, features = ["load-dynamic", "ndarray"] }
# ort's prerelease dependency range otherwise drifts to an incompatible ort-sys.
ort-sys = "=2.0.0-rc.4"

# Wayland portal client (xdg-desktop-portal) — for screencast + global shortcuts.
ashpd = { version = "0.9", default-features = false, features = ["tokio"] }
zbus = "4"
pipewire = "0.8"

# X11 path
x11rb = { version = "0.13", features = ["composite", "shape", "shm", "xfixes", "xinerama"] }

# Wayland layer-shell + raw clients
smithay-client-toolkit = "0.19"
wayland-client = "0.31"
wayland-protocols = { version = "0.31", features = ["client", "unstable"] }
wayland-protocols-wlr = { version = "0.2", features = ["client"] }

# GPU compute for inpainting (Vulkan via wgpu)
wgpu = "22"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.3"

# Async runtime — ashpd + pipewire + ort all want one
tokio = { version = "1", features = ["full"] }
