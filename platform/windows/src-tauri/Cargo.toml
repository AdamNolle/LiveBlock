[package]
name = "liveblock-windows"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LiveBlock — Windows port (Rust + Tauri 2 + windows-rs)"

[lib]
name = "liveblock_windows_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "liveblock-windows"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
# Shared core (data types + JSON format identical to macOS / Linux).
liveblock-regions = { path = "../../../core/crates/liveblock-regions" }
liveblock-labels = { path = "../../../core/crates/liveblock-labels" }
liveblock-detection = { path = "../../../core/crates/liveblock-detection" }
liveblock-config = { path = "../../../core/crates/liveblock-config" }

tauri = { version = "2.0", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-shell = "2.0"
tauri-plugin-os = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
once_cell = "1.19"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
ndarray = "0.16"
half = "2.4"
arc-swap = "1.7"
crossbeam-channel = "0.5"
dirs = "5"

# Pin ort to rc.4. DirectML EP is the Windows GPU path; CPU is the fallback.
ort = { version = "2.0.0-rc.4", default-features = false, features = ["directml", "load-dynamic", "ndarray"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Foundation",
    "Foundation_Collections",
] }
windows-core = "0.58"
tray-icon = "0.18"
raw-window-handle = "0.6"
