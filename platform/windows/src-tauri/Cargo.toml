[package]
name = "liveblock-windows"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LiveBlock — Windows port (Rust + Tauri 2 + windows-rs)"

[lib]
name = "liveblock_windows_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "liveblock-windows"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
# Shared core (data types + JSON format identical to macOS / Linux).
# `liveblock-core` brings the Tracker -> decide_verdict -> build_remove_mask_from_tracks
# pipeline + the DRM-safe paint-over path; `liveblock-tracker` is re-exported by it
# but we depend on it directly too for the concrete `Tracker`/`Observation` types.
liveblock-core = { path = "../../../core/crates/liveblock-core" }
liveblock-tracker = { path = "../../../core/crates/liveblock-tracker" }
liveblock-regions = { path = "../../../core/crates/liveblock-regions" }
liveblock-labels = { path = "../../../core/crates/liveblock-labels" }
liveblock-detection = { path = "../../../core/crates/liveblock-detection" }

tauri = { version = "2.0", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-shell = "2.0"
tauri-plugin-os = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
once_cell = "1.19"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png"] }
arc-swap = "1.7"
crossbeam-channel = "0.5"
dirs = "5"

# Pin ort EXACTLY to the version resolved in Cargo.lock (rc.12 — the rc this
# tree was last locked against). rc.4 -> rc.12 changed the public API
# (ort::session::Session, ort::ep execution providers, the no-Result inputs!
# macro, and (&Shape, &[T]) tensor extraction); detection.rs is written to rc.12.
#
# We deliberately DO NOT enable the `ndarray` feature: it would pull ort's
# ndarray 0.17 alongside any other ndarray in the tree. detection.rs feeds the
# model a flat `(shape, Vec<f32>)` and reads outputs back as `(&Shape, &[f32])`,
# so no ndarray bridge is needed. DirectML is the Windows GPU EP; CPU is the
# fallback. `load-dynamic` downloads/loads onnxruntime.dll at runtime.
#
# `api-24` selects the ONNX Runtime 1.24 API surface (the level rc.12's `default`
# feature pins). It MUST be enabled: with `default-features = false` + the EP
# registration code that `load-dynamic` compiles, ort references API fields
# (e.g. the VitisAI EP append) that only exist behind `api-18+`. Omitting it
# breaks ort's own build.
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "api-24", "directml", "load-dynamic"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Foundation",
    "Foundation_Collections",
] }
windows-core = "0.58"
tray-icon = "0.18"
raw-window-handle = "0.6"
