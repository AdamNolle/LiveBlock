name: LiveBlock
options:
  bundleIdPrefix: com.adamnolle
  deploymentTarget:
    macOS: "26.0"
targets:
  LiveBlock:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources
        excludes:
          - liveblock-detector.mlpackage.bak
      - path: core/crates/liveblock-bridge/generated/LiveBlockBridge/LiveBlockBridge.swift
        group: Bridge
      - path: core/crates/liveblock-bridge/generated/SwiftBridgeCore.swift
        group: Bridge
    info:
      path: Info.plist
      properties:
        NSScreenCaptureUsageDescription: "LiveBlock uses ScreenCaptureKit to intercept and modify display frames."
        NSAccessibilityUsageDescription: "LiveBlock uses Accessibility access to register global hotkeys."
        NSPrincipalClass: NSApplication
        LiveBlockTrainingRuntimeEnabled: "$(LIVEBLOCK_TRAINING_RUNTIME_ENABLED)"
        # Auto-load every .ttf/.otf in the bundle's Resources/ root. Bundling
        # Geist (UI), Geist Mono (numerals), and Bricolage Grotesque (display)
        # so Font.custom("Geist", ...) etc. resolve instead of silently falling
        # back to SF Pro. All three are SIL OFL — GPL-3 compatible.
        ATSApplicationFontsPath: "."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adamnolle.LiveBlock
        SWIFT_VERSION: "5.10"
        CODE_SIGN_STYLE: Automatic
        DEAD_CODE_STRIPPING: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: "Sources/LiveBlock-Bridging-Header.h"
        HEADER_SEARCH_PATHS: "$(SRCROOT)/core/crates/liveblock-bridge/generated $(SRCROOT)/core/crates/liveblock-bridge/generated/LiveBlockBridge"
        OTHER_LDFLAGS: "-lliveblock_bridge"
      configs:
        Debug:
          LIBRARY_SEARCH_PATHS: "$(SRCROOT)/core/target/universal/debug"
          LIVEBLOCK_TRAINING_RUNTIME_ENABLED: YES
          # Hardened runtime blocks XCTest injection under a self-signed
          # codesigning identity. Off for local dev, on for Release.
          ENABLE_HARDENED_RUNTIME: NO
        Release:
          LIBRARY_SEARCH_PATHS: "$(SRCROOT)/core/target/universal/release"
          ENABLE_HARDENED_RUNTIME: YES
          LIVEBLOCK_TRAINING_RUNTIME_ENABLED: NO
    preBuildScripts:
      - name: Validate production model keyring
        script: |
          set -euo pipefail
          if [[ "${CONFIGURATION}" == "Release" ]]; then
            if [[ "${LIVEBLOCK_ALLOW_EMPTY_MODEL_KEYRING:-0}" == "1" ]]; then
              /usr/bin/python3 "${SRCROOT}/tools/validate_model_keyring.py" \
                --keyring "${SRCROOT}/Sources/Resources/trusted-model-keys.json" --allow-empty
            else
              release_root="${SRCROOT}/Sources/Resources"
              /usr/bin/python3 "${SRCROOT}/tools/validate_model_keyring.py" \
                --keyring "${release_root}/release-trusted-model-keys.json"
              [[ -d "${release_root}/release-liveblock-detector.mlmodelc" ]] || {
                echo "Production Release requires precompiled release-liveblock-detector.mlmodelc" >&2; exit 1;
              }
              [[ -f "${release_root}/release-liveblock-detector.manifest.json" && ! -L "${release_root}/release-liveblock-detector.manifest.json" ]] || {
                echo "Production Release requires regular release-liveblock-detector.manifest.json" >&2; exit 1;
              }
            fi
          fi
        inputFiles:
          - $(SRCROOT)/Sources/Resources/trusted-model-keys.json
          - $(SRCROOT)/tools/validate_model_keyring.py
        basedOnDependencyAnalysis: false
      - name: Build liveblock-bridge (universal)
        script: |
          set -euo pipefail
          "${SRCROOT}/tools/build_bridge.sh"
        outputFiles:
          - $(SRCROOT)/core/target/universal/debug/libliveblock_bridge.a
          - $(SRCROOT)/core/target/universal/release/libliveblock_bridge.a
        basedOnDependencyAnalysis: false
  LiveBlockTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - Tests/LiveBlockTests
    dependencies:
      - target: LiveBlock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adamnolle.LiveBlockTests
        SWIFT_VERSION: "5.10"
        GENERATE_INFOPLIST_FILE: YES
        HEADER_SEARCH_PATHS: "$(SRCROOT)/core/crates/liveblock-bridge/generated $(SRCROOT)/core/crates/liveblock-bridge/generated/LiveBlockBridge"
schemes:
  LiveBlock:
    build:
      targets:
        LiveBlock: all
        LiveBlockTests: [test]
    test:
      targets:
        - LiveBlockTests
